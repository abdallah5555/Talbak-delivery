<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#orangeGrad)" />
  
  <!-- Delivery Scooter / Bag Icon -->
  <g transform="translate(96, 96)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Bag / Box -->
    <rect x="60" y="80" width="200" height="180" rx="20" fill="#ffffff" fill-opacity="0.15" />
    <!-- Handle -->
    <path d="M120 80 V50 C120 38.954 128.954 30 140 30 H180 C191.046 30 200 38.954 200 50 V80" />
    <!-- Speed Lines -->
    <path d="M10 110 H40" />
    <path d="M20 170 H40" />
    <path d="M5 230 H40" />
    <!-- Location Pin / Clock badge -->
    <circle cx="230" cy="210" r="35" fill="#facc15" stroke="#ffffff" stroke-width="12" />
    <path d="M230 190 V210 L242 222" stroke="#1e293b" stroke-width="8" />
  </g>
</svg>
