name: One-time production repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[codex-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authentication, PIN and phone normalization
        shell: python
        run: |
          from pathlib import Path

          auth = Path('src/components/AuthModal.tsx')
          s = auth.read_text()
          s = s.replace("const trimmedPhone = phone.trim().replace(/\\D/g, '');", "const trimmedPhone = phone.trim().replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\\D/g, '');")
          s = s.replace("if (trimmedPhone.length < 10 || !trimmedPhone.startsWith('01')) {", "if (!((trimmedPhone.length === 11 && trimmedPhone.startsWith('01')) || (trimmedPhone.length === 13 && trimmedPhone.startsWith('20')))) {")
          s = s.replace("trimmedPhone,\n        trimmedPass,", "trimmedPhone.startsWith('20') ? '0' + trimmedPhone.slice(2) : trimmedPhone,\n        trimmedPass,")
          s = s.replace("onChange={(e) => setPhone(e.target.value)}", "onChange={(e) => setPhone(e.target.value.replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))))}")
          s = s.replace("onChange={(e) => setLoginPhone(e.target.value);", "onChange={(e) => setLoginPhone(e.target.value.replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))));")
          s = s.replace("onChange={(e) => setPin(e.target.value.replace(/\\D/g, ''))}", "onChange={(e) => setPin(e.target.value.replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\\D/g, ''))}")
          s = s.replace("onChange={(e) => setConfirmPin(e.target.value.replace(/\\D/g, ''))}", "onChange={(e) => setConfirmPin(e.target.value.replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\\D/g, ''))}")
          auth.write_text(s)

          pin = Path('src/components/PinVerificationModal.tsx')
          s = pin.read_text()
          s = s.replace("onChange={(e) => setPin(e.target.value.replace(/\\D/g, ''))}", "onChange={(e) => setPin(e.target.value.replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\\D/g, ''))}")
          pin.write_text(s)

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace("  fetchCouponsFromDb, saveCouponToDb, deleteCouponFromDb,", "  fetchCouponsFromDb, saveCouponToDb, deleteCouponFromDb,")
          s = s.replace("  isSupabaseConfigured, checkTrustedDevice, fetchUserProfileById\n", "  isSupabaseConfigured, checkTrustedDevice, fetchUserProfileById, getCurrentUserSessionProfile\n")
          s = s.replace("  const handleLogoutRequest = () => {\n    // PIN verification temporarily disabled - execute logout directly\n    executeLogout();\n  };\n\n  // Security check for Trusted Devices & 48h PIN expiry (Temporarily disabled)\n  useEffect(() => {\n    // PIN verification temporarily disabled\n    return;\n  }, [currentUser?.id]);", "  const handleLogoutRequest = () => {\n    if (!currentUser) return executeLogout();\n    setPinModalMode('logout');\n    setIsPinModalOpen(true);\n  };\n\n  // Security check for Trusted Devices & 48h PIN expiry\n  useEffect(() => {\n    if (!currentUser?.id || authStatus === 'unauthenticated') return;\n    let cancelled = false;\n    (async () => {\n      const device = getDeviceSignature();\n      const trusted = await checkTrustedDevice(device.deviceId);\n      if (cancelled) return;\n      if (!trusted) {\n        setPinModalMode('security');\n        setIsPinModalOpen(true);\n        return;\n      }\n      const sessionProfile = await getCurrentUserSessionProfile();\n      if (cancelled || !sessionProfile.user) return;\n      if (sessionProfile.needsPin) {\n        setPinModalMode('security');\n        setIsPinModalOpen(true);\n      }\n    })().catch((error) => console.warn('[Security] PIN check failed:', error));\n    return () => { cancelled = true; };\n  }, [currentUser?.id, authStatus]);")
          app.write_text(s)

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-time-production-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthModal.tsx src/components/PinVerificationModal.tsx src/App.tsx .github/workflows/one-time-production-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m "[codex-auto] fix: restore PIN security and Egyptian phone validation"
          git push origin main
