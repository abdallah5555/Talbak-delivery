name: Talbak E2E

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Deployed Talbak URL to test (prefer a preview/staging deployment)'
        required: true
        default: 'https://talbak-delivery.vercel.app/'
        type: string

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || (secrets.E2E_SUPABASE_URL != '' && secrets.E2E_SUPABASE_SERVICE_ROLE_KEY != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ inputs.target_url || 'https://talbak-delivery.vercel.app/' }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Allow production deployment to settle
        if: ${{ github.event_name == 'push' }}
        run: sleep 45
      - name: Verify target is reachable
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "$E2E_BASE_URL/?customer=1"
      - name: Run E2E
        run: npm run e2e -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talbak-playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: talbak-e2e-failures
          path: test-results/
          retention-days: 7
